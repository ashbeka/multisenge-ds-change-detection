[project]
name = "rtw-3dcnn-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.4.0, !=2.4.0+cpu; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "torch==2.4.0+cu118; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.4.0+cu118; sys_platform == 'win32'",
    "torchvision==0.19.0, !=0.19.0+cpu; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "torchvision==0.19.0+cu118; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.19.0+cu118; sys_platform == 'win32'",
    "pandas>=2.2.3",
    "pydantic>=2.9.2",
    "albumentations>=1.4.18",
    "opencv-python>=4.10.0.84",
    "timm>=1.0.10",
    "pytorchvideo>=0.1.5",
    "scikit-learn>=1.5.2",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "lightning>=2.4.0",
    "wandb>=0.19.0",
    "torchmetrics>=1.6.0",
    "tensorboard>=2.18.0",
    "rich>=13.9.4",
    "typer>=0.15.1",
    "plotly>=6.0.0",
    "numba>=0.61.0",
    "umap-learn>=0.5.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "torch-cpu", marker = "sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')" },
    { index = "torch-cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "torch-cuda", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "torch-cpu", marker = "sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')" },
    { index = "torch-cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "torch-cuda", marker = "sys_platform == 'win32'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
